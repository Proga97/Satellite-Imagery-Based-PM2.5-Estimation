# conda env create -f environment.yml && conda activate pm25-pipeline
name: pm25-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.1
  - pyarrow>=15
  - pyyaml>=6
  - requests>=2.31
  - tqdm>=4.66
  - pyproj>=3.6
  - shapely>=2.0
  - pillow>=10
  - matplotlib>=3.8
  - pytorch>=2.1
  - torchvision>=0.16
  - pytest>=7
  - pip:
      - earthengine-api>=1.6
      - -e .
